name: JarBox desktop research lab
on:
  push:
    branches: [loader-ios-jit-probe]
    paths:
      - 'tools/desktop_lab/**'
      - 'tools/tests/test_array_lookup_mode1.py'
      - 'J2MEEmulator/minijvm/**'
      - 'J2MEEmulator/Resources/jars/**'
      - 'J2MEEmulator/RuntimePatches/**'
      - 'j2me_api/**'
      - 'codemagic.yaml'
      - '.github/workflows/jarbox-desktop-lab.yml'
  workflow_dispatch:
jobs:
  linux-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - gc_index: '0'
            artifact: JarBox-PC-WSL-x64
          - gc_index: '1'
            artifact: JarBox-PC-WSL-x64-gc-index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libcairo2-dev python3-tk xvfb xauth
      - run: bash tools/desktop_lab/build.sh "$RUNNER_TEMP/lab"
        env:
          JARBOX_DESKTOP_GC_INDEX: ${{ matrix.gc_index }}
      - run: bash tools/desktop_lab/test.sh "$RUNNER_TEMP/lab"
      - run: xvfb-run -a python3 tools/desktop_lab/test_gui.py "$RUNNER_TEMP/lab"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/lab/jarbox-lab
            ${{ runner.temp }}/lab/jars/
            ${{ runner.temp }}/lab/build-sha256.txt
            ${{ runner.temp }}/lab/build-profile.txt
            ${{ runner.temp }}/lab/source-commit.txt
            ${{ runner.temp }}/lab/gui.py
            ${{ runner.temp }}/lab/labctl.py
            ${{ runner.temp }}/lab/lab_inspector.py
            ${{ runner.temp }}/lab/Start-JarBox.cmd
            ${{ runner.temp }}/lab/start-wsl.sh
            ${{ runner.temp }}/lab/README.md
            ${{ runner.temp }}/lab/fixture/trace.csv*
            ${{ runner.temp }}/lab/fixture/run.log
