name: JarBox iOS candidate validation
on:
  push:
    branches: [loader-ios-jit-probe]
    paths:
      - '.github/workflows/jarbox-ios-candidate.yml'
      - 'tools/run_ios_candidate_ci.py'
      - 'tools/generate_residual_build_identity.py'
      - 'tools/tests/test_*.py'
      - 'codemagic.yaml'
      - 'J2MEEmulator/UI/GameViewController.swift'
      - 'J2MEEmulator/UI/AppsListViewController.swift'
      - 'J2MEEmulator/minijvm/jvm/jarbox_residual_*.h'
      - 'J2MEEmulator/minijvm/jvm/jarbox_block_ir*.h'
      - 'J2MEEmulator/minijvm/jvm/jarbox_render_island.h'
      - 'J2MEEmulator/minijvm/jvm/jarbox_glyph_*.h'
      - 'J2MEEmulator/minijvm/jvm/jarbox_gc_deferred_index.h'
      - 'J2MEEmulator/minijvm/jvm/garbage.c'
      - 'J2MEEmulator/minijvm/jvm/garbage.h'
      - 'J2MEEmulator/minijvm/jvm/class_load.c'
      - 'J2MEEmulator/minijvm/jvm/jvm.h'
      - 'J2MEEmulator/minijvm/jvm/jvm.c'
      - 'J2MEEmulator/minijvm/jvm/interpreter.c'
      - 'J2MEEmulator/minijvm/jvm/jarbox_treo_state.h'
      - 'J2MEEmulator/NativeBridge/j2me_render.m'
      - 'J2MEEmulator/NativeBridge/jvm_bridge.c'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Isolated binary raster, intrinsic candidate or matched control'
        type: choice
        options: [binary-trial, binary, intrinsics, control, residual, headless, headless-render, headless-render-gc, headless-reconstructed, deep-treo-unified]
        default: binary-trial
permissions:
  contents: read
jobs:
  ios-candidate:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.configuration) || '["headless-render-gc","deep-treo-unified"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare recipe validation
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -m unittest discover -s tools/tests -p test_ios_candidate_ci.py
          python3 tools/run_ios_candidate_ci.py --configuration "$CONFIGURATION" --plan
          xcodebuild -version
          /usr/libexec/java_home -v 17
      - name: Run same checked-in Codemagic recipe with isolated flags
        run: python3 tools/run_ios_candidate_ci.py --configuration "$CONFIGURATION"
      - uses: actions/upload-artifact@v4
        with:
          name: jarbox-ios-${{ env.CONFIGURATION }}-${{ github.sha }}
          path: |
            J2ME-Treo-jar-cpu-audit-unsigned.ipa
            JarBox-symbols.zip
          if-no-files-found: error
          retention-days: 7
