name: JarBox real MiniJVM intrinsic differential
on:
  push:
    branches: [loader-ios-jit-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-intrinsics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual two-VM differential with ASan and UBSan
        run: bash tools/host_multivm_smoke/run.sh asan 1 intrinsics
