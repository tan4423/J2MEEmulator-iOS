name: JarBox real MiniJVM intrinsic differential
on:
  push:
    branches: [loader-ios-jit-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-intrinsics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: GC mark and deferred differential with sanitizers
        run: |
          JARBOX_GC_SCAN_SANITIZE=1 python3 -m unittest discover -s tools/tests -p test_gc_mark_scan.py
          JARBOX_GC_DEFER_SANITIZE=1 python3 -m unittest discover -s tools/tests -p test_gc_deferred_objects.py
      - name: Collector-local deferred index differential
        run: |
          JARBOX_GC_DEFER_SANITIZE=1 python3 -m unittest discover -s tools/tests -p test_gc_deferred_index.py
          bash tools/host_multivm_smoke/run.sh asan 1 gc_index
      - name: Generic block IR execution differential
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -I J2MEEmulator/minijvm/jvm tools/tests/block_ir_host.c -o /tmp/jarbox-block-ir
          /tmp/jarbox-block-ir
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -pthread -I J2MEEmulator/minijvm/jvm tools/tests/block_ir_shared_host.c -o /tmp/jarbox-block-shared
          /tmp/jarbox-block-shared
          bash tools/host_multivm_smoke/run.sh asan 1 block_ir
      - name: JIT flag hot path contract
        run: python3 -m unittest discover -s tools/tests -p test_jit_flag_hot_path.py
      - name: General closed render island compiler and real VM differential
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -I J2MEEmulator/minijvm/jvm tools/tests/render_island_host.c -o /tmp/jarbox-render-island
          /tmp/jarbox-render-island
          bash tools/host_multivm_smoke/run.sh asan 1 render_island
      - name: Focused CPU log analyzer
        run: python3 -m unittest discover -s tools/tests -p test_focused_cpu.py
      - name: Exact native renderer lease and STOP contract
        run: python3 -m unittest discover -s tools/tests -p test_multivm_render_handle_hash.py
      - name: Binary trial gate and log admission
        run: python3 -m unittest discover -s tools/tests -p test_binary_trial.py
      - name: Binary sprite host differential
        run: python3 -m unittest discover -s tools/tests -p test_binary_sprite.py
      - name: Actual two-VM differential with ASan and UBSan
        run: bash tools/host_multivm_smoke/run.sh asan 1 intrinsics
      - name: Executable residual in two independent MiniJVM fixtures
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual
      - name: Residual keeps draw wrapper invocation and null faults
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_draw
      - name: Exact residual Canvas, wrapper and owner binding predicate
        run: JARBOX_RESIDUAL_SANITIZE=1 python3 -m unittest discover -s tools/tests -p test_residual_binding.py
      - name: Real MiniJVM paint ancestry and offscreen rejection
        run: bash tools/host_multivm_smoke/run.sh asan 1 binding
      - name: Resume original interpreter mid-loop without replay
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_resume
      - name: Eliminate dead linked primitive reads but preserve volatile and cold reads
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_read
      - name: Remove entire closed screen draw regions with original-PC fallback
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_closed
      - name: Mixed reference/integer locals and fifth local across whole-loop continuation
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_extended
      - name: Stateful whole-loop residual with retained virtual calls and mixed reference locals
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_wide
      - name: Background array-argument loops and wide induction with exact fallback
        run: bash tools/host_multivm_smoke/run.sh asan 1 residual_background
      - name: Four-way matched-mode host CPU benchmark
        run: |
          python3 -m unittest discover -s tools/tests -p test_host_intrinsic_benchmark.py
          bash tools/host_multivm_smoke/run.sh plain 1 benchmark

  # Keep the strict compatibility gate visible and mandatory, but do
  # not prevent the independent engine and residual jobs from being exercised.
  gc-weak-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict real MiniJVM weak/finalizer contract
        run: bash tools/host_multivm_smoke/run.sh asan 1 gc_callbacks
