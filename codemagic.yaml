workflows:
  jit-probe-unsigned:
    name: J2ME Treo JIT probe unsigned
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      xcode: "26.3"
      vars:
        # Ready-to-build defaults. No settings need to be entered in Codemagic.
        JARBOX_VM_SWITCH_BASELINE: "0"
        JARBOX_VM_PAINT_BRIDGE_BASELINE: "0"
        JARBOX_PAINT_SAMPLE_DISABLED: "1"
        JARBOX_VM_UTF16_BASELINE: "0"
        JARBOX_VM_IMAGE_CACHE_BASELINE: "1" # OFF by default: measured ~0 hits in 188.7s
        JARBOX_VM_ARRAY_LOOKUP_EXPERIMENT: "0" # Isolate game-aware Treo
        JARBOX_VM_ARRAY_LOOKUP_DIAGNOSTIC: "0" # No method observer overhead
        JARBOX_VM_PERF_CANDIDATE: "0" # Matched all-off control for Treo CPU investigation; set 1 to reproduce candidate
        JARBOX_PAINT_QOS_EXPERIMENT: "0" # isolate Ninja Core; QoS trial remains available
        JARBOX_NINJA_CORE_EXPERIMENT: "0" # continuous scoped Core trial is OFF
        JARBOX_CORE_ABA: "0" # device E3: scoped sink regressed process CPU; full raster default
        JARBOX_NATIVE_PAINT_DIAG: "1" # sparse native CPU attribution; 0 = same-source uninstrumented control
        JARBOX_CROP_CACHE_V2: "1" # candidate; 0 = old direct-mapped cache
        JARBOX_REGION_STAGE_DIAG: "1" # sparse region tail timing, independently switchable
        JARBOX_HOTSPOT_DIAG: "1" # cooperative method/backedge sampling; 0 = same-source off
        JARBOX_VM_DECODED_INT_EXPERIMENT: "0"
        JARBOX_VM_EVENT_SLEEP_EXPERIMENT: "0"
        JARBOX_VM_CONST_ARITH_FUSION_EXPERIMENT: "0"
        JARBOX_VM_CONST_BRANCH_FUSION_EXPERIMENT: "0"
    scripts: &jarbox_ipa_shared_scripts
      - name: Build and package unsigned iPhone IPA
        script: |
          set -euo pipefail
          export RUNNER_TEMP="$(mktemp -d)"
          trap 'rm -rf "$RUNNER_TEMP"' EXIT
          export GITHUB_WORKSPACE="$PWD"
          JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          export J2ME_PROJECT=J2MEEmulator.xcodeproj

          # Exercise the class/method/field API-surface auditor against
          # small Java-8 fixtures. No untrusted game code is executed.
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/tests -p 'test_*.py'
          
          # GameViewController controls idleTimerDisabled only while its
          # game UI is visible. The library must allow iOS auto-lock;
          # do not inject the old process-wide always-awake constructor.

          set -euo pipefail
          jars="$PWD/J2MEEmulator/Resources/jars"
          # Java 8 PC-mod compatibility must live on the BOOT classpath:
          # Class_fq.d and Class_gv.g use java.net.Socket directly and
          # java/nio/charset/StandardCharsets.UTF_8 plus the Charset-based
          # OutputStreamWriter constructor. Modifying Connector in the app
          # API JAR alone cannot affect this code path.
          # Generate the remaining 33 Java 8 java.util.function interfaces
          # deterministically, without altering the 10 already patched APIs.
          function_src="$RUNNER_TEMP/java8-function-src"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/generate_java8_function_boot.py "$function_src"
          core_classes="$RUNNER_TEMP/java8-core-classes"
          mkdir -p "$core_classes"
          javac --release 8 -sourcepath '' -cp "$jars/minijvm_rt.jar:$jars/j2me_api.jar" \
            -d "$core_classes" \
            J2MEEmulator/RuntimePatches/java/nio/charset/StandardCharsets.java \
            J2MEEmulator/RuntimePatches/java/io/OutputStreamWriter.java \
            J2MEEmulator/RuntimePatches/java/time/LocalTime.java \
            J2MEEmulator/RuntimePatches/java/time/LocalDate.java \
            J2MEEmulator/RuntimePatches/java/time/LocalDateTime.java \
            J2MEEmulator/RuntimePatches/java/time/Instant.java \
            J2MEEmulator/RuntimePatches/java/time/Duration.java \
            J2MEEmulator/RuntimePatches/java/lang/VerifyError.java \
            J2MEEmulator/RuntimePatches/java/util/Base64.java \
            J2MEEmulator/RuntimePatches/java/util/Objects.java \
            J2MEEmulator/RuntimePatches/java/util/StringJoiner.java \
            J2MEEmulator/RuntimePatches/java/util/Optional.java \
            J2MEEmulator/RuntimePatches/java/util/OptionalInt.java \
            J2MEEmulator/RuntimePatches/java/util/OptionalLong.java \
            J2MEEmulator/RuntimePatches/java/util/OptionalDouble.java \
            J2MEEmulator/RuntimePatches/java/util/function/Supplier.java \
            J2MEEmulator/RuntimePatches/java/util/function/Consumer.java \
            J2MEEmulator/RuntimePatches/java/util/function/Function.java \
            J2MEEmulator/RuntimePatches/java/util/function/Predicate.java \
            J2MEEmulator/RuntimePatches/java/util/function/IntConsumer.java \
            J2MEEmulator/RuntimePatches/java/util/function/IntSupplier.java \
            J2MEEmulator/RuntimePatches/java/util/function/LongConsumer.java \
            J2MEEmulator/RuntimePatches/java/util/function/LongSupplier.java \
            J2MEEmulator/RuntimePatches/java/util/function/DoubleConsumer.java \
            J2MEEmulator/RuntimePatches/java/util/function/DoubleSupplier.java \
            "$function_src"/java/util/function/*.java \
            J2MEEmulator/RuntimePatches/com/sun/cldc/i18n/j2me/UTF_8_Reader.java
          jar uf "$jars/minijvm_rt.jar" -C "$core_classes" .
          # URLConnection and HttpURLConnection retain the miniJVM-specific
          # GCF ABI; compile against the real packaged boot classes.
          http_base_old="$RUNNER_TEMP/http-base-original"
          http_base_new="$RUNNER_TEMP/http-base-classes"
          mkdir -p "$http_base_old" "$http_base_new"
          (cd "$http_base_old" && jar xf "$jars/minijvm_rt.jar" java/net/URLConnection.class 'java/net/URLConnection$1.class' 'java/net/URLConnection$CachedFile.class' java/net/HttpURLConnection.class)
          javac -source 8 -target 8 -bootclasspath "$jars/minijvm_rt.jar:$jars/j2me_api.jar" -sourcepath '' \
            -d "$http_base_new" J2MEEmulator/RuntimePatches/java/net/URLConnection.java J2MEEmulator/RuntimePatches/java/net/HttpURLConnection.java
          for entry in java/net/URLConnection.class 'java/net/URLConnection$1.class' 'java/net/URLConnection$CachedFile.class' java/net/HttpURLConnection.class; do
            javap -p -s "$http_base_old/$entry" | sed '/^Compiled from /d; /^}/d; /^$/d; s/ synchronized / /g' | sort > "$RUNNER_TEMP/http-base-old-api"
            javap -p -s "$http_base_new/$entry" | sed '/^Compiled from /d; /^}/d; /^$/d; s/ synchronized / /g' | sort > "$RUNNER_TEMP/http-base-new-api"
            comm -23 "$RUNNER_TEMP/http-base-old-api" "$RUNNER_TEMP/http-base-new-api" > "$RUNNER_TEMP/http-base-missing-api"
            if [ -s "$RUNNER_TEMP/http-base-missing-api" ]; then
              echo "Missing ABI members in $entry"
              cat "$RUNNER_TEMP/http-base-missing-api"
              exit 1
            fi
          done
          jar uf "$jars/minijvm_rt.jar" -C "$http_base_new" .
          (cd "$http_base_old" && jar xf "$jars/minijvm_rt.jar" java/net/URLConnection.class 'java/net/URLConnection$1.class' 'java/net/URLConnection$CachedFile.class' java/net/HttpURLConnection.class)
          for entry in java/net/URLConnection.class 'java/net/URLConnection$1.class' 'java/net/URLConnection$CachedFile.class' java/net/HttpURLConnection.class; do
            cmp "$http_base_old/$entry" "$http_base_new/$entry"
          done
          # Also verify the new nested file-cache metadata class.
          (cd "$http_base_old" && jar xf "$jars/minijvm_rt.jar" 'java/net/HttpURLConnection$HttpCachedFile.class')
          cmp "$http_base_old/"'java/net/HttpURLConnection$HttpCachedFile.class' "$http_base_new/"'java/net/HttpURLConnection$HttpCachedFile.class'
          # The miniJVM HttpURLConnection superclass has a protected CLDC
          # connection field absent from the desktop JDK. Use the exact boot
          # JAR and verify the nested handler's binary API before replacing it.
          http_original="$RUNNER_TEMP/http-original"
          http_classes="$RUNNER_TEMP/http-classes"
          mkdir -p "$http_original" "$http_classes"
          (cd "$http_original" && jar xf "$jars/minijvm_rt.jar" 'org/mini/urlhandler/HttpHandler$HttpURLConnectionImpl.class')
          http_entry='org/mini/urlhandler/HttpHandler$HttpURLConnectionImpl.class'
          javap -p -s "$http_original/$http_entry" | sed '/^Compiled from /d; s/ synchronized / /g' > "$RUNNER_TEMP/http-original-api"
          javac -source 8 -target 8 -bootclasspath "$jars/minijvm_rt.jar:$jars/j2me_api.jar" -sourcepath '' \
            -d "$http_classes" J2MEEmulator/RuntimePatches/org/mini/urlhandler/HttpHandler.java
          javap -p -s "$http_classes/$http_entry" | sed '/^Compiled from /d; s/ synchronized / /g' > "$RUNNER_TEMP/http-patched-api"
          diff -u "$RUNNER_TEMP/http-original-api" "$RUNNER_TEMP/http-patched-api"
          javap -c -p "$http_classes/$http_entry" > "$RUNNER_TEMP/http-patched-code"
          grep -Eq 'ifnull|ifnonnull' "$RUNNER_TEMP/http-patched-code"
          jar uf "$jars/minijvm_rt.jar" -C "$http_classes" "$http_entry"
          (cd "$http_original" && jar xf "$jars/minijvm_rt.jar" "$http_entry")
          cmp "$http_original/$http_entry" "$http_classes/$http_entry"
          # Compile against packaged miniJVM (not desktop SocketImpl).
          socket_old="$RUNNER_TEMP/socket-original"
          socket_new="$RUNNER_TEMP/socket-classes"
          mkdir -p "$socket_old" "$socket_new"
          (cd "$socket_old" && jar xf "$jars/minijvm_rt.jar" java/net/Socket.class 'java/net/Socket$1.class' 'java/net/Socket$2.class')
          javac -source 8 -target 8 -bootclasspath "$jars/minijvm_rt.jar:$jars/j2me_api.jar" -sourcepath '' \
            -d "$socket_new" J2MEEmulator/RuntimePatches/java/net/Socket.java
          # Existing public/protected/package ABI must remain present.
          # Ignore new private helpers and permit additional public methods.
          for entry in java/net/Socket.class 'java/net/Socket$1.class' 'java/net/Socket$2.class'; do
            javap -s "$socket_old/$entry" | sed '/^Compiled from /d; /^}/d; /^$/d' | sort > "$RUNNER_TEMP/socket-old-api"
            javap -s "$socket_new/$entry" | sed '/^Compiled from /d; /^}/d; /^$/d' | sort > "$RUNNER_TEMP/socket-new-api"
            comm -23 "$RUNNER_TEMP/socket-old-api" "$RUNNER_TEMP/socket-new-api" > "$RUNNER_TEMP/socket-missing-api"
            if [ -s "$RUNNER_TEMP/socket-missing-api" ]; then
              cat "$RUNNER_TEMP/socket-missing-api"
              exit 1
            fi
          done
          jar uf "$jars/minijvm_rt.jar" -C "$socket_new" .
          (cd "$socket_old" && jar xf "$jars/minijvm_rt.jar" java/net/Socket.class 'java/net/Socket$1.class' 'java/net/Socket$2.class')
          for entry in java/net/Socket.class 'java/net/Socket$1.class' 'java/net/Socket$2.class'; do
            cmp "$socket_old/$entry" "$socket_new/$entry"
          done
          # Verify the classes that will be packaged, NOT the host JDK
          # (javap by class name otherwise resolves java.base first).
          core_verify="$RUNNER_TEMP/java8-core-verify"
          mkdir -p "$core_verify"
          (cd "$core_verify" && jar xf "$jars/minijvm_rt.jar" \
            java/nio/charset/StandardCharsets.class java/io/OutputStreamWriter.class \
            java/time/LocalTime.class java/time/LocalDate.class \
            java/time/LocalDateTime.class java/time/Instant.class \
            java/time/Duration.class java/lang/VerifyError.class \
            java/util/Base64.class 'java/util/Base64$Encoder.class' \
            'java/util/Base64$Decoder.class' java/util/Objects.class \
            java/util/StringJoiner.class \
            java/util/Optional.class java/util/OptionalInt.class \
            java/util/OptionalLong.class java/util/OptionalDouble.class \
            java/util/function/Supplier.class \
            java/util/function/IntConsumer.class java/util/function/IntSupplier.class \
            java/util/function/LongConsumer.class java/util/function/LongSupplier.class \
            java/util/function/DoubleConsumer.class java/util/function/DoubleSupplier.class \
            java/util/function/Consumer.class java/util/function/Function.class \
            java/util/function/Predicate.class \
            java/util/function/BiFunction.class java/util/function/BiPredicate.class \
            java/util/function/BinaryOperator.class java/util/function/IntUnaryOperator.class \
            com/sun/cldc/i18n/j2me/UTF_8_Reader.class)
          javap "$core_verify/java/nio/charset/StandardCharsets.class" > "$RUNNER_TEMP/utf8-class.txt"
          javap "$core_verify/java/io/OutputStreamWriter.class" > "$RUNNER_TEMP/writer-class.txt"
          grep -Fq 'public static final java.nio.charset.Charset UTF_8;' "$RUNNER_TEMP/utf8-class.txt"
          grep -Fq 'java.io.OutputStreamWriter(java.io.OutputStream, java.nio.charset.Charset);' "$RUNNER_TEMP/writer-class.txt"
          javap -c -p "$core_verify/java/io/OutputStreamWriter.class" > "$RUNNER_TEMP/writer-bytecode.txt"
          grep -Fq 'java/io/OutputStreamWriter$CharsetBuffer' "$RUNNER_TEMP/writer-bytecode.txt"
          (cd "$core_verify" && jar xf "$jars/minijvm_rt.jar" 'java/io/OutputStreamWriter$CharsetBuffer.class')
          javap -c -p "$core_verify/"'java/io/OutputStreamWriter$CharsetBuffer.class' > "$RUNNER_TEMP/writer-buffer-bytecode.txt"
          grep -Fq 'java/io/BufferedOutputStream' "$RUNNER_TEMP/writer-buffer-bytecode.txt"
          javap -c "$core_verify/com/sun/cldc/i18n/j2me/UTF_8_Reader.class" > "$RUNNER_TEMP/utf8-reader-bytecode.txt"
          grep -Fq 'ready:()Z' "$RUNNER_TEMP/utf8-reader-bytecode.txt"
          javap "$core_verify/java/time/LocalTime.class" > "$RUNNER_TEMP/localtime-signatures.txt"
          grep -Fq 'public static java.time.LocalTime now();' "$RUNNER_TEMP/localtime-signatures.txt"
          grep -Fq 'public static java.time.LocalTime of(int, int);' "$RUNNER_TEMP/localtime-signatures.txt"
          grep -Fq 'public java.time.LocalTime withSecond(int);' "$RUNNER_TEMP/localtime-signatures.txt"
          grep -Fq 'public java.time.LocalTime withNano(int);' "$RUNNER_TEMP/localtime-signatures.txt"
          grep -Fq 'public boolean equals(java.lang.Object);' "$RUNNER_TEMP/localtime-signatures.txt"
          javap -c "$core_verify/java/time/LocalTime.class" > "$RUNNER_TEMP/localtime-bytecode.txt"
          grep -Fq 'java/util/Calendar.getInstance:()Ljava/util/Calendar;' "$RUNNER_TEMP/localtime-bytecode.txt"
          javap "$core_verify/java/time/LocalDate.class" > "$RUNNER_TEMP/localdate-signatures.txt"
          grep -Fq 'public static java.time.LocalDate of(int, int, int);' "$RUNNER_TEMP/localdate-signatures.txt"
          grep -Fq 'public static java.time.LocalDate parse(java.lang.CharSequence);' "$RUNNER_TEMP/localdate-signatures.txt"
          grep -Fq 'public java.time.LocalDate plusDays(long);' "$RUNNER_TEMP/localdate-signatures.txt"
          javap -c "$core_verify/java/time/LocalDate.class" > "$RUNNER_TEMP/localdate-bytecode.txt"
          grep -Fq 'java/util/Calendar.getInstance:()Ljava/util/Calendar;' "$RUNNER_TEMP/localdate-bytecode.txt"
          javap "$core_verify/java/time/LocalDateTime.class" > "$RUNNER_TEMP/localdatetime-signatures.txt"
          grep -Fq 'public static java.time.LocalDateTime of(int, int, int, int, int, int, int);' "$RUNNER_TEMP/localdatetime-signatures.txt"
          grep -Fq 'public static java.time.LocalDateTime parse(java.lang.CharSequence);' "$RUNNER_TEMP/localdatetime-signatures.txt"
          grep -Fq 'public java.time.LocalDateTime plusNanos(long);' "$RUNNER_TEMP/localdatetime-signatures.txt"
          javap "$core_verify/java/time/Instant.class" > "$RUNNER_TEMP/instant-signatures.txt"
          grep -Fq 'public static java.time.Instant ofEpochSecond(long, long);' "$RUNNER_TEMP/instant-signatures.txt"
          grep -Fq 'public static java.time.Instant parse(java.lang.CharSequence);' "$RUNNER_TEMP/instant-signatures.txt"
          grep -Fq 'public long toEpochMilli();' "$RUNNER_TEMP/instant-signatures.txt"
          javap -c "$core_verify/java/time/Instant.class" > "$RUNNER_TEMP/instant-bytecode.txt"
          grep -Fq 'java/lang/System.currentTimeMillis:()J' "$RUNNER_TEMP/instant-bytecode.txt"
          javap "$core_verify/java/time/Duration.class" > "$RUNNER_TEMP/duration-signatures.txt"
          grep -Fq 'public static java.time.Duration ofSeconds(long, long);' "$RUNNER_TEMP/duration-signatures.txt"
          grep -Fq 'public java.time.Duration plusNanos(long);' "$RUNNER_TEMP/duration-signatures.txt"
          grep -Fq 'public long toMillis();' "$RUNNER_TEMP/duration-signatures.txt"
          javap "$core_verify/java/lang/VerifyError.class" > "$RUNNER_TEMP/verify-error-signatures.txt"
          grep -Fq 'public java.lang.VerifyError(java.lang.String);' "$RUNNER_TEMP/verify-error-signatures.txt"
          javap "$core_verify/java/util/Base64.class" > "$RUNNER_TEMP/base64-signatures.txt"
          grep -Fq 'public static java.util.Base64$Encoder getEncoder();' "$RUNNER_TEMP/base64-signatures.txt"
          grep -Fq 'public static java.util.Base64$Decoder getUrlDecoder();' "$RUNNER_TEMP/base64-signatures.txt"
          javap "$core_verify/java/util/Base64\$Encoder.class" > "$RUNNER_TEMP/base64-encoder-signatures.txt"
          grep -Fq 'public java.lang.String encodeToString(byte[]);' "$RUNNER_TEMP/base64-encoder-signatures.txt"
          javap "$core_verify/java/util/Base64\$Decoder.class" > "$RUNNER_TEMP/base64-decoder-signatures.txt"
          grep -Fq 'public byte[] decode(java.lang.String);' "$RUNNER_TEMP/base64-decoder-signatures.txt"
          javap "$core_verify/java/util/Objects.class" > "$RUNNER_TEMP/objects-signatures.txt"
          grep -Fq 'public static boolean deepEquals(java.lang.Object, java.lang.Object);' "$RUNNER_TEMP/objects-signatures.txt"
          grep -Fq 'public static <T> T requireNonNull(T, java.lang.String);' "$RUNNER_TEMP/objects-signatures.txt"
          javap "$core_verify/java/util/StringJoiner.class" > "$RUNNER_TEMP/stringjoiner-signatures.txt"
          grep -Fq 'public java.util.StringJoiner(java.lang.CharSequence, java.lang.CharSequence, java.lang.CharSequence);' "$RUNNER_TEMP/stringjoiner-signatures.txt"
          grep -Fq 'public java.util.StringJoiner merge(java.util.StringJoiner);' "$RUNNER_TEMP/stringjoiner-signatures.txt"
          grep -Fq 'public java.util.StringJoiner setEmptyValue(java.lang.CharSequence);' "$RUNNER_TEMP/stringjoiner-signatures.txt"
          javap "$core_verify/java/util/Optional.class" > "$RUNNER_TEMP/optional-signatures.txt"
          grep -Fq 'public static <T> java.util.Optional<T> ofNullable(T);' "$RUNNER_TEMP/optional-signatures.txt"
          grep -Fq 'public <U> java.util.Optional<U> flatMap(java.util.function.Function<? super T, java.util.Optional<U>>);' "$RUNNER_TEMP/optional-signatures.txt"
          javap "$core_verify/java/util/function/Function.class" > "$RUNNER_TEMP/function-signatures.txt"
          grep -Fq 'public default <V> java.util.function.Function<T, V> andThen(java.util.function.Function<? super R, ? extends V>);' "$RUNNER_TEMP/function-signatures.txt"
          javap "$core_verify/java/util/function/Predicate.class" > "$RUNNER_TEMP/predicate-signatures.txt"
          grep -Fq 'public default java.util.function.Predicate<T> negate();' "$RUNNER_TEMP/predicate-signatures.txt"
          javap "$core_verify/java/util/function/BiFunction.class" > "$RUNNER_TEMP/bifunction-signatures.txt"
          grep -Fq 'public default <V> java.util.function.BiFunction<T, U, V> andThen(java.util.function.Function<? super R, ? extends V>);' "$RUNNER_TEMP/bifunction-signatures.txt"
          javap "$core_verify/java/util/function/BiPredicate.class" > "$RUNNER_TEMP/bipredicate-signatures.txt"
          grep -Fq 'public default java.util.function.BiPredicate<T, U> negate();' "$RUNNER_TEMP/bipredicate-signatures.txt"
          javap "$core_verify/java/util/function/IntUnaryOperator.class" > "$RUNNER_TEMP/intunary-signatures.txt"
          grep -Fq 'public static java.util.function.IntUnaryOperator identity();' "$RUNNER_TEMP/intunary-signatures.txt"
          javap "$core_verify/java/util/function/BinaryOperator.class" > "$RUNNER_TEMP/binaryoperator-signatures.txt"
          grep -Fq 'public static <T> java.util.function.BinaryOperator<T> minBy(java.util.Comparator<? super T>);' "$RUNNER_TEMP/binaryoperator-signatures.txt"
          # Check ALL generated classfiles are present in the actual patched
          # boot JAR. Checking only signatures of a few files can miss a
          # packaging error or an anonymous helper class.
          python3 - "$function_src" "$jars/minijvm_rt.jar" <<'PY'
          from pathlib import Path
          import sys, zipfile
          source_dir = Path(sys.argv[1]) / "java/util/function"
          expected = {f"java/util/function/{p.stem}.class" for p in source_dir.glob("*.java")}
          if len(expected) != 33:
              raise SystemExit("Expected exactly 33 generated functional interfaces")
          with zipfile.ZipFile(sys.argv[2]) as boot:
              actual = set(boot.namelist())
          missing = expected - actual
          if missing:
              raise SystemExit("Missing Java 8 boot APIs: " + ", ".join(sorted(missing)))
          for name in ("BiConsumer$1", "BiPredicate$3", "BinaryOperator$2", "IntUnaryOperator$3"):
              if f"java/util/function/{name}.class" not in actual:
                  raise SystemExit("Missing functional helper class: " + name)
          print("[JarBoxCompat] full_java8_function_api=43/43 generated=33")
          PY
          javap "$core_verify/java/util/OptionalInt.class" > "$RUNNER_TEMP/optional-int-signatures.txt"
          javap "$core_verify/java/util/OptionalLong.class" > "$RUNNER_TEMP/optional-long-signatures.txt"
          javap "$core_verify/java/util/OptionalDouble.class" > "$RUNNER_TEMP/optional-double-signatures.txt"
          grep -Fq 'public int getAsInt();' "$RUNNER_TEMP/optional-int-signatures.txt"
          grep -Fq 'public long getAsLong();' "$RUNNER_TEMP/optional-long-signatures.txt"
          grep -Fq 'public double getAsDouble();' "$RUNNER_TEMP/optional-double-signatures.txt"
          grep -Fq 'public <X extends java.lang.Throwable> int orElseThrow(java.util.function.Supplier<? extends X>) throws X;' "$RUNNER_TEMP/optional-int-signatures.txt"
          grep -Fq 'public <X extends java.lang.Throwable> long orElseThrow(java.util.function.Supplier<? extends X>) throws X;' "$RUNNER_TEMP/optional-long-signatures.txt"
          grep -Fq 'public <X extends java.lang.Throwable> double orElseThrow(java.util.function.Supplier<? extends X>) throws X;' "$RUNNER_TEMP/optional-double-signatures.txt"
          for kind in Int Long Double; do
            javap "$core_verify/java/util/function/${kind}Consumer.class" > "$RUNNER_TEMP/${kind}-consumer-signatures.txt"
            javap "$core_verify/java/util/function/${kind}Supplier.class" > "$RUNNER_TEMP/${kind}-supplier-signatures.txt"
            grep -Fq "public default java.util.function.${kind}Consumer andThen(java.util.function.${kind}Consumer);" "$RUNNER_TEMP/${kind}-consumer-signatures.txt"
            grep -Fq "public abstract $(echo "$kind" | tr '[:upper:]' '[:lower:]') getAs${kind}();" "$RUNNER_TEMP/${kind}-supplier-signatures.txt"
          done
          # Default methods produce helper classes; ensure they made it into the
          # boot JAR instead of validating only the interface classfiles.
          jar tf "$jars/minijvm_rt.jar" > "$RUNNER_TEMP/java8-boot-entries.txt"
          grep -Fqx 'java/util/function/Function$1.class' "$RUNNER_TEMP/java8-boot-entries.txt"
          grep -Fqx 'java/util/function/Consumer$1.class' "$RUNNER_TEMP/java8-boot-entries.txt"
          grep -Fqx 'java/util/function/Predicate$4.class' "$RUNNER_TEMP/java8-boot-entries.txt"
          for kind in Int Long Double; do
            grep -Fqx "java/util/function/${kind}Consumer\$1.class" "$RUNNER_TEMP/java8-boot-entries.txt"
          done
          echo "[JarBoxNET][BUILD] java8_core_utf8=present localtime=present localdate=present localdatetime=present instant=present duration=present verifyerror=present base64=present objects=present optional=present primitive_optional=present function_api=43/43 boot_jar=patched short_read=enabled"
          classes="$RUNNER_TEMP/lcdui-classes"
          mkdir -p "$classes"
          javac --release 8 -sourcepath '' -cp "$jars/j2me_api.jar:$jars/minijvm_rt.jar" \
            -d "$classes" j2me_api/src/javax/microedition/lcdui/{Display,Canvas,Graphics,Image,TextBox,NativeBridge,Form,ChoiceGroup,List}.java \
            j2me_api/src/javax/microedition/shell/MIDletRunner.java \
            j2me_api/src/javax/microedition/rms/impl/AndroidRecordStoreManager.java \
            j2me_api/src/javax/microedition/rms/impl/RmsEventLog.java \
            j2me_api/src/javax/microedition/io/Connector.java \
            j2me_api/src/javax/microedition/io/MicroCompatibleSocketConnection.java
          jar uf "$jars/j2me_api.jar" -C "$classes" .
          jar tf "$jars/j2me_api.jar" | grep -Fxq 'javax/microedition/rms/impl/RmsEventLog.class'
          javap -classpath "$jars/j2me_api.jar:$jars/minijvm_rt.jar" -c \
            javax.microedition.rms.impl.AndroidRecordStoreManager > "$RUNNER_TEMP/jarbox-rms-manager.txt"
          grep -Fq 'RmsEventLog.note' "$RUNNER_TEMP/jarbox-rms-manager.txt"
          echo "[JarBoxStorage][BUILD] rms_metadata_log=present corrupted_save_preservation=enabled"
          # The shipped Connector.class was the unsupported-transport stub.
          # Require the actual Java ME protocol dispatcher in the built JAR.
          javap -classpath "$jars/j2me_api.jar:$jars/minijvm_rt.jar" -c javax.microedition.io.Connector > "$RUNNER_TEMP/connector-bytecode.txt"
          grep -Fq 'ConnectionBaseInterface.openPrim' "$RUNNER_TEMP/connector-bytecode.txt"
          grep -Fq 'MicroCompatibleSocketConnection' "$RUNNER_TEMP/connector-bytecode.txt"
          javap -classpath "$jars/j2me_api.jar:$jars/minijvm_rt.jar" -c javax.microedition.io.MicroCompatibleSocketConnection > "$RUNNER_TEMP/socket-bytecode.txt"
          grep -Fq 'java/net/Socket.getInputStream' "$RUNNER_TEMP/socket-bytecode.txt"
          echo "[JarBoxNET][BUILD] socket=micro_compatible http/https=standard_dispatch"

          # Optional analysis only. Build normally if no game JAR is
          # available locally on the Codemagic builder; never fetch one.
          if [[ -n "${JARBOX_COMPAT_AUDIT_JAR:-}" && -f "${JARBOX_COMPAT_AUDIT_JAR}" ]]; then
            python3 tools/jar_api_audit.py --boot "$jars/minijvm_rt.jar" --api "$jars/j2me_api.jar" --output "$RUNNER_TEMP/jarbox-api-audit.json" "$JARBOX_COMPAT_AUDIT_JAR"
            python3 tools/jar_bytecode_profile.py --output "$RUNNER_TEMP/jarbox-bytecode-profile.json" "$JARBOX_COMPAT_AUDIT_JAR"
            echo "[JarBoxCompat] api_report=$RUNNER_TEMP/jarbox-api-audit.json bytecode_report=$RUNNER_TEMP/jarbox-bytecode-profile.json"
          fi
          
          # Use only the pinned SLJIT source; do not build or run upstream scripts.
          git init -q "$RUNNER_TEMP/sljit-upstream"
          git -C "$RUNNER_TEMP/sljit-upstream" fetch -q --depth=1 https://github.com/digitalgust/miniJVM.git 76f904ea4008a8058db5155bf5ee2cfe94d19e60
          test "$(git -C "$RUNNER_TEMP/sljit-upstream" rev-parse FETCH_HEAD)" = "76f904ea4008a8058db5155bf5ee2cfe94d19e60"
          git -C "$RUNNER_TEMP/sljit-upstream" checkout -q --detach FETCH_HEAD
          sljit="$RUNNER_TEMP/sljit-upstream/minijvm/c/utils/sljit"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -DSLJIT_CONFIG_AUTO=1 '-DSLJIT_UPDATE_WX_FLAGS(from,to,enable_exec)=((void)0)' -I"$sljit" -c "$sljit/sljitLir.c" -o "$RUNNER_TEMP/TreoSLJIT.o"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -DSLJIT_CONFIG_AUTO=1 -I"$sljit" -c "tools/treo_jit_probe.c" -o "$RUNNER_TEMP/TreoJITProbe.o"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          
          project=J2MEEmulator.xcodeproj
          if [[ ! -f "$project/project.pbxproj" ]]; then
            echo "::error::Missing $project/project.pbxproj"
            exit 1
          fi
          for jar in minijvm_rt.jar j2me_api.jar; do
            path="J2MEEmulator/Resources/jars/$jar"
            if [[ ! -s "$path" ]] || ! /usr/bin/unzip -tq "$path"; then
              echo "::error::Missing or invalid bundled JAR: $path"
              exit 1
            fi
          done
          
          # Switch-only reference uses the same sources, settings, and JARs.
          # Set JARBOX_VM_SWITCH_BASELINE=1 in Codemagic to build it.
          vm_dispatch_flag=""
          if [[ "${JARBOX_VM_SWITCH_BASELINE:-0}" == "1" ]]; then
            vm_dispatch_flag="-DTREO_VM_FORCE_SWITCH=1"
            echo "[JarBoxVM][BUILD] dispatch=switch (matched baseline)"
          else
            echo "[JarBoxVM][BUILD] dispatch=computed-goto (candidate)"
          fi
          # Separate paint-bridge A/B from interpreter dispatch A/B.
          # Same mode 8 Canvas code; only the verified headless draw-call
          # elision differs. Leave unset for the paint-bridge candidate.
          vm_paint_bridge_flag=""
          if [[ "${JARBOX_VM_PAINT_BRIDGE_BASELINE:-0}" == "1" ]]; then
            vm_paint_bridge_flag="-DTREO_VM_PAINT_BRIDGE_DISABLED=1"
            echo "[JarBoxVM][BUILD] paint_bridge=off (matched baseline)"
          else
            echo "[JarBoxVM][BUILD] paint_bridge=on (candidate)"
          fi
          # Matched build for profiling overhead: same code, with sampler disabled.
          paint_sample_flag=""
          if [[ "${JARBOX_PAINT_SAMPLE_DISABLED:-0}" == "1" ]]; then
            paint_sample_flag="-DTREO_VM_PAINT_SAMPLE_DISABLED=1"
            echo "[JarBoxVM][BUILD] paint_sampler=off (same-source baseline)"
          else
            echo "[JarBoxVM][BUILD] paint_sampler=1-in-32 (diagnostic)"
          fi
          # UTF-16 method-intrinsic matched source baseline.
          utf16_flag=""
          if [[ "${JARBOX_VM_UTF16_BASELINE:-0}" == "1" ]]; then
            utf16_flag="-DTREO_VM_UTF16_FAST_DISABLED=1"
            echo "[JarBoxVM][BUILD] utf16_fast=off (baseline)"
          else
            echo "[JarBoxVM][BUILD] utf16_fast=on"
          fi
          # Fully preconfigured cache A/B: compile identical Java sources;
          # only the native mode-8 cache gate differs between workflows.
          image_cache_flag=""
          if [[ "${JARBOX_VM_IMAGE_CACHE_BASELINE:-0}" == "1" ]]; then
            image_cache_flag="-DTREO_VM_IMAGE_CACHE_DISABLED=1"
            echo "[JarBoxVM][BUILD] image_cache=off (matched baseline)"
          else
            echo "[JarBoxVM][BUILD] image_cache=on (Treo mode 8 only)"
          fi
          # Experimental bytecode-pattern inliner. Both A/B workflows use
          # exactly the same source and differ only in this compile flag.
          array_lookup_flag=""
          if [[ "${JARBOX_VM_ARRAY_LOOKUP_EXPERIMENT:-0}" == "1" ]]; then
            array_lookup_flag="-DTREO_VM_ARRAY_LOOKUP_EXPERIMENT=1"
            echo "[JarBoxVM][BUILD] array_lookup=on (experimental)"
          else
            echo "[JarBoxVM][BUILD] array_lookup=off (safe baseline)"
          fi
          array_lookup_diagnostic_flag=""
          if [[ "${JARBOX_VM_ARRAY_LOOKUP_DIAGNOSTIC:-0}" == "1" ]]; then
            array_lookup_diagnostic_flag="-DTREO_VM_ARRAY_LOOKUP_DIAGNOSTIC=1"
            echo "[JarBoxVM][BUILD] array_lookup_diagnostic=on"
          fi
          if [[ "${JARBOX_VM_PERF_CANDIDATE:-0}" == "1" ]]; then
            export JARBOX_VM_CONST_ARITH_FUSION_EXPERIMENT=1
            export JARBOX_VM_CONST_BRANCH_FUSION_EXPERIMENT=1
            export JARBOX_VM_DECODED_INT_EXPERIMENT=1
            export JARBOX_VM_EVENT_SLEEP_EXPERIMENT=1
          fi
          const_fusion_flags=""
          perf_arith=0
          perf_branch=0
          if [[ "${JARBOX_VM_CONST_ARITH_FUSION_EXPERIMENT:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_VM_CONST_ARITH_FUSION_EXPERIMENT=1"
            perf_arith=1
          fi
          if [[ "${JARBOX_VM_CONST_BRANCH_FUSION_EXPERIMENT:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_VM_CONST_BRANCH_FUSION_EXPERIMENT=1"
            perf_branch=1
          fi
          perf_decoded=0
          perf_sleep=0
          if [[ "${JARBOX_VM_DECODED_INT_EXPERIMENT:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_VM_DECODED_INT_EXPERIMENT=1"
            perf_decoded=1
          fi
          if [[ "${JARBOX_VM_EVENT_SLEEP_EXPERIMENT:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_VM_EVENT_SLEEP_EXPERIMENT=1"
            perf_sleep=1
          fi
          perf_qos=0
          if [[ "${JARBOX_PAINT_QOS_EXPERIMENT:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_PAINT_QOS_EXPERIMENT=1"
            perf_qos=1
          fi
          perf_core=0
          if [[ "${JARBOX_NINJA_CORE_EXPERIMENT:-0}" == "1" || "${JARBOX_CORE_ABA:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_NINJA_CORE_EXPERIMENT=1"
            perf_core=1
          fi
          perf_native_diag=0
          if [[ "${JARBOX_NATIVE_PAINT_DIAG:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_NATIVE_PAINT_DIAG=1"
            perf_native_diag=1
          fi
          perf_crop=0
          if [[ "${JARBOX_CROP_CACHE_V2:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_CROP_CACHE_V2=1"
            perf_crop=1
          fi
          perf_region=0
          if [[ "${JARBOX_REGION_STAGE_DIAG:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_REGION_STAGE_DIAG=1"
            perf_region=1
          fi
          perf_hot=0
          if [[ "${JARBOX_HOTSPOT_DIAG:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_HOTSPOT_DIAG=1"
            perf_hot=1
          fi
          perf_aba=0
          if [[ "${JARBOX_CORE_ABA:-0}" == "1" ]]; then
            const_fusion_flags="$const_fusion_flags -DTREO_CORE_ABA=1"
            perf_aba=1
          fi
          perf_profile="const-arith-${perf_arith}_const-branch-${perf_branch}_decoded-int-${perf_decoded}_event-sleep-${perf_sleep}_paint-qos-${perf_qos}_ninja-core-${perf_core}_native-paint-diag-${perf_native_diag}_crop-v2-${perf_crop}_region-stage-${perf_region}_hotspot-${perf_hot}_core-aba-${perf_aba}"
          echo "[JarBoxVM][BUILD] perf_profile=$perf_profile const_fusion_flags=${const_fusion_flags:-off}"
          xcodebuild -list -project "$J2ME_PROJECT"
          xcodebuild -project "$J2ME_PROJECT" \
            -scheme J2MEEmulator -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/jarbox-build" \
            "OTHER_LDFLAGS=\$(inherited) $RUNNER_TEMP/TreoSLJIT.o $RUNNER_TEMP/TreoJITProbe.o -framework UIKit -framework Foundation -framework Metal" \
            "TREO_GAME_JIT_CFLAGS=-DTREO_IOS_GAME_JIT=1 -I$sljit $vm_dispatch_flag $vm_paint_bridge_flag $paint_sample_flag $utf16_flag $image_cache_flag $array_lookup_flag $array_lookup_diagnostic_flag $const_fusion_flags" \
            PRODUCT_BUNDLE_IDENTIFIER=app.j2metreo.personal \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          
          products="$RUNNER_TEMP/jarbox-build/Build/Products/Release-iphoneos"
          apps=("$products"/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo 'Expected exactly one iPhone app in Release-iphoneos' >&2
            ls -la "$products" || true
            exit 1
          fi
          app="${apps[0]}"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName J2ME Treo' "$app/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string J2ME Treo' "$app/Info.plist"

          # Stamp the *actual checked-out commit* into the final packaged app.
          # Swift reads this even if the JVM fails before running Java code.
          # This is not a hardcoded source version or an in-memory trace.
          build_commit="$(git rev-parse --verify HEAD)"
          test "${#build_commit}" -eq 40
          /usr/libexec/PlistBuddy -c "Add :JarBoxBuildCommit string $build_commit" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :JarBoxBootPatch string java8_stringjoiner_profile_v10' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :JarBoxPerfProfile string $perf_profile" "$app/Info.plist"
          actual_commit="$(/usr/libexec/PlistBuddy -c 'Print :JarBoxBuildCommit' "$app/Info.plist")"
          test "$actual_commit" = "$build_commit"
          echo "[JarBoxNET][BUILD] final_ipa_commit=$build_commit"
          staging="$(mktemp -d)"
          mkdir "$staging/Payload"
          ditto "${apps[0]}" "$staging/Payload/$(basename "${apps[0]}")"
          (cd "$staging" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/J2ME-Treo-jar-cpu-audit-unsigned.ipa" Payload)
          
          test -s "$GITHUB_WORKSPACE/J2ME-Treo-jar-cpu-audit-unsigned.ipa"
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/J2ME-Treo-jar-cpu-audit-unsigned.ipa"
          # Check the archived artifact, not only the staging .app.
          ipa_plist="$RUNNER_TEMP/packaged-Info.plist"
          unzip -p "$GITHUB_WORKSPACE/J2ME-Treo-jar-cpu-audit-unsigned.ipa" "Payload/*.app/Info.plist" > "$ipa_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :JarBoxBuildCommit' "$ipa_plist")" = "$build_commit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :JarBoxBootPatch' "$ipa_plist")" = "java8_stringjoiner_profile_v10"
          test "$(/usr/libexec/PlistBuddy -c 'Print :JarBoxPerfProfile' "$ipa_plist")" = "$perf_profile"
          echo "[JarBoxNET][BUILD] stamped IPA archive verified"

          # Preserve exact-build symbols outside the IPA. A later rebuild
          # of the same commit is not a substitute for a matching UUID.
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          dsym="$app.dSYM"
          test -f "$app/$executable"
          test -f "$dsym/Contents/Resources/DWARF/$executable"
          symbol_stage="$(mktemp -d)"
          xcrun dwarfdump --uuid "$app/$executable" > "$symbol_stage/executable-uuid.txt"
          xcrun dwarfdump --uuid "$dsym/Contents/Resources/DWARF/$executable" > "$symbol_stage/dsym-uuid.txt"
          awk '/^UUID: / {print $2, $3}' "$symbol_stage/executable-uuid.txt" | sort > "$symbol_stage/executable-uuid.normalized"
          awk '/^UUID: / {print $2, $3}' "$symbol_stage/dsym-uuid.txt" | sort > "$symbol_stage/dsym-uuid.normalized"
          test -s "$symbol_stage/executable-uuid.normalized"
          cmp "$symbol_stage/executable-uuid.normalized" "$symbol_stage/dsym-uuid.normalized"
          printf '%s\n' "$build_commit" > "$symbol_stage/build-commit.txt"
          ditto "$dsym" "$symbol_stage/$(basename "$dsym")"
          (cd "$symbol_stage" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/JarBox-symbols.zip" .)
          /usr/bin/unzip -tq "$GITHUB_WORKSPACE/JarBox-symbols.zip"
          cat "$symbol_stage/executable-uuid.txt"
          echo "[JarBoxVM][BUILD] matching dSYM archive verified"
    artifacts: &jarbox_ipa_shared_artifacts
      - J2ME-Treo-jar-cpu-audit-unsigned.ipa
      - JarBox-symbols.zip
